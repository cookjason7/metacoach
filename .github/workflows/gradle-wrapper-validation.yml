name: Gradle Wrapper Validation

on:
  push:
    paths:
      - '**/gradle-wrapper.jar'
      - '**/gradle-wrapper.properties'
  pull_request:
    paths:
      - '**/gradle-wrapper.jar'
      - '**/gradle-wrapper.properties'

jobs:
  validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
